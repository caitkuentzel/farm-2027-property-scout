[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "farm-2027-property-scout"
version = "0.1.0"
description = "Human-controlled Florida tax-deed property research tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cait Kuentzel" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "playwright>=1.46",
  "reportlab>=4.2",
  "shapely>=2.0",
]

[project.scripts]
farm2027-scout = "farm2027_scout.cli:main"

[project.optional-dependencies]
dev = [
  "pypdf>=5.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/farm2027_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: accesses the live public auction website"]

[tool.ruff]
line-length = 100
target-version = "py311"
