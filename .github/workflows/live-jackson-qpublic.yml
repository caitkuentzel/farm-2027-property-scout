name: INTERNAL CHECK - qPublic adapter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - name: Retrieve live qPublic report
        run: |
          python - <<'PY'
          import json
          from farm2027_scout.adapters.jackson_county.qpublic import fetch_property

          record = fetch_property("02-2N-11-0083-00F0-0120")
          required = ("parcel_id", "property_use", "acreage", "building_value", "assessed_value")
          data = record.to_dict()
          assert all(data[field] is not None for field in required), data
          assert data["owner"] == "FOSTER ROZEL ESTATE", data
          assert data["acreage"] == "1.136", data
          assert data["building_value"] == "0", data
          assert data["extra_features_value"] == "0", data
          print(json.dumps(data, indent=2))
          PY
