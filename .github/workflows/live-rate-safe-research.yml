name: Live rate-safe property research

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      auction_date:
        description: Auction date in MM/DD/YYYY format
        required: true
        default: 08/25/2026

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - name: Research every live auction parcel politely
        env:
          AUCTION_DATE: ${{ inputs.auction_date || '08/25/2026' }}
        run: |
          farm2027-scout \
            --auction-date "$AUCTION_DATE" \
            --include-qpublic \
            --delay-seconds 20 \
            --output full-property-research.json
      - name: Require all ten current parcels and show output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("full-property-research.json").read_text())
          assert len(rows) == 10, rows
          required = (
              "auction_date",
              "case_number",
              "parcel_id",
              "opening_bid",
              "acreage",
              "property_use",
              "building_value",
              "extra_features_value",
              "auction_assessed_value",
              "qpublic_assessed_value",
          )
          assert all(row[field] is not None for row in rows for field in required), rows
          print(json.dumps(rows, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rate-safe-property-research
          path: full-property-research.json
          if-no-files-found: error
