name: Live rate-safe property research

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/latest/**"
  workflow_dispatch:
    inputs:
      auction_date:
        description: Auction date in MM/DD/YYYY format
        required: true
        default: 08/25/2026

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q
      - name: Research every live auction parcel politely
        env:
          AUCTION_DATE: ${{ inputs.auction_date || '08/25/2026' }}
        run: |
          farm2027-scout \
            --auction-date "$AUCTION_DATE" \
            --include-qpublic \
            --screen \
            --verify-gis \
            --verify-road-access \
            --verify-flood-hazard \
            --verify-wetlands \
            --calculate-hazard-overlap \
            --delay-seconds 20 \
            --output full-property-research.json
      - name: Validate live research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("full-property-research.json").read_text())
          assert len(rows) >= 1, rows
          required = (
              "auction_date", "case_number", "parcel_id", "opening_bid",
              "auction_assessed_value", "qpublic_assessed_value",
              "screening_decision", "screening_score",
          )
          assert all(row.get(field) is not None for row in rows for field in required), rows
          assert all(row.get("auction_source_url") for row in rows), rows
          assert all(row.get("qpublic_source_url") for row in rows), rows
          print(f"Validated {len(rows)} live parcels")
          PY
      - name: Generate clickable fact-checker PDF
        run: |
          mkdir -p reports/latest
          python scripts/generate_fact_checker_pdf.py \
            full-property-research.json \
            reports/latest/Jackson-County-Property-Fact-Checker.pdf
      - name: Validate PDF content and evidence links
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          path = Path("reports/latest/Jackson-County-Property-Fact-Checker.pdf")
          assert path.exists() and path.stat().st_size >= 10_000, path
          pdf = PdfReader(path)
          links = sum(
              1
              for page in pdf.pages
              for annotation in (page.get("/Annots") or [])
              if annotation.get_object().get("/Subtype") == "/Link"
          )
          assert len(pdf.pages) >= 4, len(pdf.pages)
          assert links >= 6, links
          text = "\n".join(page.extract_text() or "" for page in pdf.pages)
          assert "Decision Board" in text
          assert "Documentary Proof Required" in text
          print(f"PDF PASS: {len(pdf.pages)} pages, {links} clickable evidence links")
          PY
      - name: Upload the finished PDF
        uses: actions/upload-artifact@v4
        with:
          name: Jackson-County-Property-Fact-Checker
          path: reports/latest/Jackson-County-Property-Fact-Checker.pdf
          if-no-files-found: error
      - name: Publish latest PDF in the repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- reports/latest/Jackson-County-Property-Fact-Checker.pdf
          if git diff --cached --quiet; then
            echo "Latest PDF is unchanged"
          else
            git commit -m "Publish latest Jackson County fact-checker PDF"
            git push
          fi
